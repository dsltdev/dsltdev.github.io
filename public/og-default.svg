<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#050a08"/>
  
  <!-- Gradient orbs -->
  <circle cx="200" cy="150" r="300" fill="#00e68a" opacity="0.08"/>
  <circle cx="1000" cy="480" r="250" fill="#00b36b" opacity="0.06"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a3025" stroke-width="0.5" opacity="0.3"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  
  <!-- Logo -->
  <text x="100" y="120" font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#00e68a">▸</text>
  <text x="160" y="120" font-family="JetBrains Mono, monospace" font-size="48" font-weight="700" fill="#e8f5ee">DSLT</text>
  
  <!-- Main title -->
  <text x="100" y="280" font-family="Space Grotesk, Inter, sans-serif" font-size="72" font-weight="700" fill="#e8f5ee">Desarrollo web</text>
  <text x="100" y="370" font-family="Space Grotesk, Inter, sans-serif" font-size="72" font-weight="700">
    <tspan fill="#00e68a">para negocios</tspan>
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="440" font-family="Inter, sans-serif" font-size="28" fill="#7a9a8a">Sitios web, apps y contenido para redes.</text>
  <text x="100" y="480" font-family="Inter, sans-serif" font-size="28" fill="#7a9a8a">Para negocios en Medellín y toda Colombia.</text>
  
  <!-- URL -->
  <rect x="100" y="540" width="200" height="40" rx="8" fill="#111f18" stroke="#1a3025" stroke-width="1"/>
  <text x="120" y="566" font-family="JetBrains Mono, monospace" font-size="16" fill="#00e68a">dsltdev.com</text>
  
  <!-- Decorative elements -->
  <rect x="900" y="200" width="200" height="200" rx="16" fill="#111f18" stroke="#1a3025" stroke-width="1"/>
  <text x="960" y="320" font-family="Inter, sans-serif" font-size="48">🌐</text>
  
  <rect x="1050" y="350" width="100" height="100" rx="12" fill="#0c1610" stroke="#1a3025" stroke-width="1"/>
  <text x="1080" y="415" font-family="Inter, sans-serif" font-size="32">📱</text>
</svg>
